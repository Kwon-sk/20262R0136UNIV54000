<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="top">
      <h1>2048</h1>
      <div class="top-actions">
        <div class="score-box">
          <span>점수</span>
          <strong id="score" aria-live="polite">0</strong>
        </div>
        <button type="button" id="new-game" class="primary-button">새 게임</button>
      </div>
    </header>

    <div id="board" class="board" role="grid" aria-label="2048 게임 보드"></div>

    <div class="direction-buttons" aria-label="이동 버튼">
      <button type="button" data-direction="up" aria-label="위로 이동">↑</button>
      <button type="button" data-direction="left" aria-label="왼쪽으로 이동">←</button>
      <button type="button" data-direction="down" aria-label="아래로 이동">↓</button>
      <button type="button" data-direction="right" aria-label="오른쪽으로 이동">→</button>
    </div>

    <p class="instructions">방향키나 버튼으로 같은 숫자를 합쳐 2048을 만드세요.</p>
  </main>

  <div id="dialog" class="dialog" hidden>
    <div class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button type="button" id="continue-game">계속하기</button>
        <button type="button" id="dialog-new-game" class="primary-button">새 게임</button>
      </div>
    </div>
  </div>
</body>
</html>
